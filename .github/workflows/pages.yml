name: Deploy Reiseplaner PWA to GitHub Pages

on:
  push:
    branches: [main, dev]
    paths: [reiseplaner-app/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (Produktion -> Site-Root)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site/main

      - name: Checkout dev (Test -> /dev/)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: site/dev

      - name: Combine builds
        run: |
          mkdir -p out
          cp -r site/main/reiseplaner-app/. out/
          mkdir -p out/dev
          cp -r site/dev/reiseplaner-app/. out/dev/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4
